name: oscar-sandbox

services:
  gateway:
    image: nginx/nginx-unprivileged:1.30.8-alpine
    restart: "no"
    depends_on:
      oscar:
        condition: service_healthy
    ports:
      - "${OSCAR_SANDBOX_PORT:-8444}:8443"
    networks:
      - sandbox_frontend
    secrets:
      - source: sandbox_tls_certificate
        target: tls_certificate.pem
      - source: sandbox_tls_private_key
        target: tls_private_key.pem
    environment:
      OSCAR_HTTPS_PORT: "${OSCAR_SANDBOX_PORT:-8444}"
      NGINX_ENVSUBST_FILTER: "^OSCAR_HTTPS_PORT$"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:rw,noexec,nosuid,nodev,mode=0755,uid=101,gid=101
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,mode=0755,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  oscar:
    image: "oscar:${OSCAR_VERSION:-local}"
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sandbox_frontend
      - sandbox_database
    secrets:
      - source: sandbox_admin_password
        target: oscar_admin_password
      - source: sandbox_db_password
        target: oscar_db_password
    environment:
      TZ: "${OSCAR_TIMEZONE:-UTC}"
      OSCAR_WEBAUTHN_RP_ID: "${OSCAR_WEBAUTHN_RP_ID:-}"
      OSCAR_SANDBOX_MODE: "true"
      OSCAR_SANDBOX_PORT: "${OSCAR_SANDBOX_PORT:-8444}"
      OSCAR_SANDBOX_TTL_MINUTES: "${OSCAR_SANDBOX_TTL_MINUTES:-120}"
      OSCAR_SANDBOX_STARTED_EPOCH_SEC: "${OSCAR_SANDBOX_STARTED_EPOCH_SEC:-0}"
      OSCAR_SANDBOX_INITIAL_TRACK: "${OSCAR_SANDBOX_INITIAL_TRACK:-operator}"
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/oscar_admin_password
      OSCAR_DB_PASSWORD_FILE: /run/secrets/oscar_db_password
      JAVA_OPTS: "${OSCAR_SANDBOX_JAVA_OPTS:--Xms512m -Xmx2g -Xss256k -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC}"
    volumes:
      - sandbox_state:/var/lib/oscar
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /run/oscar-native:rw,exec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
      - /var/lib/oscar/archive:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/oscar-ready && curl --silent --show-error --output /dev/null http://127.0.0.1:8282/"]
      start_period: 75s
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  postgres:
    platform: "${OSCAR_POSTGIS_PLATFORM:-linux/amd64}"
    image: "oscar-postgis:${OSCAR_VERSION:-local}"
    restart: "no"
    user: postgres
    networks:
      - sandbox_database
    secrets:
      - source: sandbox_postgres_bootstrap_password
        target: postgres_bootstrap_password
      - source: sandbox_db_password
        target: oscar_db_password
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: oscar_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      OSCAR_DB_PASSWORD_FILE: /run/secrets/oscar_db_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-local=scram-sha-256 --auth-host=scram-sha-256 -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - max_wal_size=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
      - -c
      - archive_mode=off
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - sandbox_pg:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --port=5432 --username=oscar_bootstrap --dbname=gis"]
      start_period: 25s
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  sandbox_frontend:
  sandbox_database:
    internal: true

volumes:
  sandbox_state:
    external: true
    name: oscar_sandbox_state
  sandbox_pg:
    external: true
    name: oscar_sandbox_pg

secrets:
  sandbox_admin_password:
    file: "${OSCAR_SANDBOX_RUNTIME_DIR}/secrets/oscar-admin-password.txt"
  sandbox_db_password:
    file: "${OSCAR_SANDBOX_RUNTIME_DIR}/secrets/oscar-db-password.txt"
  sandbox_postgres_bootstrap_password:
    file: "${OSCAR_SANDBOX_RUNTIME_DIR}/secrets/postgres-bootstrap-password.txt"
  sandbox_tls_certificate:
    file: "${OSCAR_SANDBOX_RUNTIME_DIR}/tls/certificate.pem"
  sandbox_tls_private_key:
    file: "${OSCAR_SANDBOX_RUNTIME_DIR}/tls/private-key.pem"
